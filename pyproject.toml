[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "molecular-imbalance"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "scikit-learn>=1.4,<1.8",
    "rdkit>=2023.9",
    "joblib>=1.3",
    "mtune==0.0.8",
    "catboost>=1.2.10",
    "torch>=2.2",
    "transformers>=4.40,<5",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
mol-experiment = "molpipeline.cli:main"
mol-config = "generate_config:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["generate_config"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
cache-dir = ".cache/uv"
